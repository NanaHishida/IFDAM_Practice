<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お会計完了</title>
  <link rel="stylesheet" href="../CSS/bootstrap.css">
  <link rel="stylesheet" href="../CSS/Complete.css">
</head>
<body>
  <header class="checkout-header">
    <div class="header-left">
      <div class="logo">CakeFromZer0</div>
      <h1>お会計完了</h1>
      <a href="Checkout.html" class="text-decoration-none point"><< 戻る</a>
    </div>
    <div id="accountInfo">アカウント名</div>
  </header>

  <main class="complete-page container">
    <section class="complete-card">
      <div class="complete-icon">✓</div>
      <h2>注文が完了しました</h2>
      <p class="complete-text"><span id="completePickupDate">○月○日</span>に店舗でお待ちしております。</p>
      <p class="complete-subtext">引き渡し日や注文内容は、注文完了メールでもご確認いただけます。</p>
      <a href="#" id="receiptLink" class="btn btn-primary btn-lg receipt-link">受取票をダウンロードする</a>
    </section>
  </main>
  <script src="../JavaScript/Complete.js"></script>
</body>
</html>
