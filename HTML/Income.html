<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>損益</title>
  <link rel="stylesheet" href="../CSS/bootstrap.css">
  <link rel="stylesheet" href="../CSS/Acceptance.css">
  <link rel="stylesheet" href="../CSS/Income.css">
</head>
<body>
  <header class="acceptance-header container-fluid">
    <div class="header-inner container d-flex align-items-center justify-content-between py-3">
      <div>
        <a href="Acceptance.html" class="brand">CakeFromZer0</a>
      </div>
      <div class="user-area">
        <span class="user-name">担当者: 経理 太郎</span>
        <button id="logoutButton" class="btn btn-outline-secondary btn-sm">ログアウト</button>
      </div>
    </div>
  </header>

  <div class="acceptance-layout container">
    <nav class="acceptance-menu">
      <a href="Acceptance.html" class="menu-item">受注管理</a>
      <a href="Replenishment.html" class="menu-item">発注</a>
      <a href="PriceChange.html" class="menu-item">値段調整</a>
      <a href="Income.html" class="menu-item active">損益</a>
      <a href="Administerer.html" class="menu-item">システム管理</a>
    </nav>

    <main class="acceptance-content py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>損益</h2>
        <div class="d-flex gap-2 align-items-center">
          <select id="periodType" class="form-select form-select-sm">
            <option value="month">月ごと</option>
            <option value="year">年ごと</option>
          </select>
          <button id="refreshIncome" class="btn btn-outline-primary btn-sm">更新</button>
        </div>
      </div>

      <section class="income-list">
        <div class="mb-3">
          <p class="text-muted">集計期間を選択してください。</p>
        </div>

        <div id="summaries" class="income-summaries">
          <!-- サンプルカード -->
          <article class="income-card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <div>
                <h3 class="card-title">2026年05月</h3>
                <p class="text-muted">2026-05-01 〜 2026-05-31</p>
              </div>
              <a href="IncomeDetails.html" class="btn btn-outline-primary">詳細を見る →</a>
            </div>
            <div class="card-body d-flex gap-3 mt-2">
              <div>仕入合計: <strong>¥12,000</strong></div>
              <div>売上合計: <strong>¥50,000</strong></div>
              <div>差引: <strong>¥38,000</strong></div>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script src="../JavaScript/Income.js"></script>
</body>
</html>
