<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>従業員アカウント管理</title>
  <link rel="stylesheet" href="../CSS/bootstrap.css">
  <link rel="stylesheet" href="../CSS/Acceptance.css">
  <link rel="stylesheet" href="../CSS/Administerer.css">
</head>
<body>
  <header class="acceptance-header container-fluid">
    <div class="header-inner container d-flex align-items-center justify-content-between py-3">
      <div>
        <a href="Administerer.html" class="brand">CakeFromZer0</a>
      </div>
      <div class="user-area">
        <span class="user-name">担当者: 管理者 太郎</span>
        <button id="logoutButton" class="btn btn-outline-secondary btn-sm">ログアウト</button>
      </div>
    </div>
  </header>

  <div class="container py-4">
    <main class="acceptance-content py-4">
      <a href="Administerer.html" class="btn btn-outline-secondary btn-sm mb-3">&lt;&lt; 戻る</a>
      <h2>従業員アカウント管理</h2>

      <div class="mb-3">
        <button id="addAccount" class="btn btn-primary">アカウントを追加する</button>
      </div>

      <section class="account-list">
        <div class="list">
          <article class="customize-item d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
              <div class="avatar">👤</div>
              <div>
                <p class="mb-0 fw-bold">山田 太郎</p>
                <p class="mb-0 text-muted">社長</p>
              </div>
            </div>
            <div>
              <button class="btn btn-outline-danger btn-sm delete-account">アカウントを削除する</button>
            </div>
          </article>

          <article class="customize-item d-flex align-items-center justify-content-between mt-2">
            <div class="d-flex align-items-center gap-3">
              <div class="avatar">👤</div>
              <div>
                <p class="mb-0 fw-bold">佐藤 管理</p>
                <p class="mb-0 text-muted">管理職</p>
              </div>
            </div>
            <div>
              <button class="btn btn-outline-danger btn-sm delete-account">アカウントを削除する</button>
            </div>
          </article>

        </div>
      </section>
    </main>
  </div>

  <div id="accountAddModal" class="customize-modal">
    <div class="customize-modal-dialog">
      <div class="customize-modal-header d-flex align-items-center justify-content-between">
        <h5 class="modal-title">従業員アカウントを追加する</h5>
        <button type="button" class="btn-close" id="closeAccountModal" aria-label="Close"></button>
      </div>
      <div class="customize-modal-body">
        <div class="mb-3">
          <label for="accountLastName" class="form-label">苗字</label>
          <input id="accountLastName" type="text" class="form-control" placeholder="例：山田">
        </div>
        <div class="mb-3">
          <label for="accountFirstName" class="form-label">名前</label>
          <input id="accountFirstName" type="text" class="form-control" placeholder="例：太郎">
        </div>
        <div class="mb-3">
          <label for="accountPassword" class="form-label">パスワード</label>
          <input id="accountPassword" type="password" class="form-control" placeholder="例：password123">
        </div>
        <div class="mb-3">
          <label for="accountRole" class="form-label">役職</label>
          <select id="accountRole" class="form-select">
            <option value="社長">社長</option>
            <option value="管理職">管理職</option>
            <option value="スタッフ">スタッフ</option>
          </select>
        </div>
      </div>
      <div class="customize-modal-footer d-flex justify-content-end gap-2">
        <button id="cancelAccountModal" class="btn btn-outline-secondary">キャンセル</button>
        <button id="submitAccountModal" class="btn btn-primary">アカウントを追加する</button>
      </div>
    </div>
  </div>

  <script src="../JavaScript/Administerer.js"></script>
</body>
</html>
