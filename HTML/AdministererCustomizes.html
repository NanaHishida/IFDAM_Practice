<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カスタマイズ管理</title>
  <link rel="stylesheet" href="../CSS/bootstrap.css">
  <link rel="stylesheet" href="../CSS/Acceptance.css">
  <link rel="stylesheet" href="../CSS/Administerer.css">
</head>
<body>
  <header class="acceptance-header container-fluid">
    <div class="header-inner container d-flex align-items-center justify-content-between py-3">
      <div>
        <a href="Administerer.html" class="brand">CakeFromZer0</a>
      </div>
      <div class="user-area">
        <span class="user-name">担当者: 管理者 太郎</span>
        <button id="logoutButton" class="btn btn-outline-secondary btn-sm">ログアウト</button>
      </div>
    </div>
  </header>

  <div class="container py-4">
    <main class="acceptance-content py-4">
      <a href="Administerer.html" class="btn btn-outline-secondary btn-sm mb-3">&lt;&lt; 戻る</a>
      <h2>カスタマイズ管理</h2>

      <div class="mb-3">
        <button id="addCustomize" class="btn btn-primary">新しく追加する</button>
      </div>

      <section class="customize-list">
        <article class="customize-item d-flex align-items-center justify-content-between">
          <div>
            <p class="mb-0 fw-bold">スポンジ：ココア</p>
            <p class="mb-0 text-muted">在庫利用: トッピング</p>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-danger btn-sm stop-order">受注を停止する</button>
            <button class="btn btn-outline-danger btn-sm delete-customize">削除する</button>
          </div>
        </article>

        <article class="customize-item d-flex align-items-center justify-content-between mt-2">
          <div>
            <p class="mb-0 fw-bold">クリーム：チョコレート</p>
            <p class="mb-0 text-muted">在庫利用: クリーム</p>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-danger btn-sm stop-order">受注を停止する</button>
            <button class="btn btn-outline-danger btn-sm delete-customize">削除する</button>
          </div>
        </article>

      </section>
    </main>
  </div>

  <div id="customizeAddModal" class="customize-modal">
    <div class="customize-modal-dialog">
      <div class="customize-modal-header d-flex align-items-center justify-content-between">
        <h5 class="modal-title">カスタマイズを新しく追加する</h5>
        <button type="button" class="btn-close" id="closeCustomizeModal" aria-label="Close"></button>
      </div>
      <div class="customize-modal-body">
        <div class="mb-3">
          <label for="customizeName" class="form-label">名前</label>
          <input id="customizeName" type="text" class="form-control" placeholder="例：チョコレートクリーム">
        </div>
        <div class="mb-3">
          <label for="customizePrice" class="form-label">値段</label>
          <input id="customizePrice" type="number" min="0" class="form-control" placeholder="例：250">
        </div>
        <div class="mb-3">
          <label for="customizePhoto" class="form-label">写真</label>
          <input id="customizePhoto" type="file" class="form-control">
        </div>
        <div class="mb-3">
          <label for="customizePreview" class="form-label">プレビュー時属性</label>
          <select id="customizePreview" class="form-select">
            <option value="base">ベース</option>
            <option value="cream">クリーム</option>
            <option value="topping">トッピング</option>
            <option value="decoration">デコレーション</option>
          </select>
        </div>
      </div>
      <div class="customize-modal-footer d-flex justify-content-end gap-2">
        <button id="cancelCustomizeModal" class="btn btn-outline-secondary">キャンセル</button>
        <button id="submitCustomizeModal" class="btn btn-primary">追加する</button>
      </div>
    </div>
  </div>

  <script src="../JavaScript/Administerer.js"></script>
</body>
</html>
