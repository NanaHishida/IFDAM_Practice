<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン・新規登録</title>
  <link rel="stylesheet" href="../CSS/bootstrap.css">
  <link rel="stylesheet" href="../CSS/Login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo">CakeFromZer0</div>
      
      <div class="tab-container">
        <button class="tab-button active" id="loginTab">ログイン</button>
        <button class="tab-button" id="signupTab">新規登録</button>
      </div>

      <!-- ログインフォーム -->
      <form id="loginForm" class="form-container active">
        <div class="form-group">
          <label for="loginEmail">メールアドレス</label>
          <input type="email" id="loginEmail" placeholder="example@example.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">パスワード</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <div class="form-links">
          <a href="#" class="form-link">パスワードを忘れた場合</a>
          <a href="#" class="form-link">利用規約</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">ログインする</button>
      </form>

      <!-- 新規登録フォーム -->
      <form id="signupForm" class="form-container">
        <div class="form-group">
          <label for="signupEmail">メールアドレス</label>
          <input type="email" id="signupEmail" placeholder="example@example.com" required>
        </div>

        <div class="form-group">
          <label for="signupPassword">パスワード</label>
          <input type="password" id="signupPassword" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label for="signupPasswordConfirm">パスワード（確認用）</label>
          <input type="password" id="signupPasswordConfirm" placeholder="••••••••" required>
        </div>

        <div class="form-checkbox">
          <input type="checkbox" id="agreeTerms" required>
          <label for="agreeTerms">利用規約に同意する</label>
        </div>

        <button type="submit" class="btn btn-success btn-block">アカウントを作成する</button>
      </form>
    </div>
  </div>

  <script src="../JavaScript/Login.js"></script>
</body>
</html>
