<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>値段調整</title>
  <link rel="stylesheet" href="../CSS/bootstrap.css">
  <link rel="stylesheet" href="../CSS/Acceptance.css">
  <link rel="stylesheet" href="../CSS/PriceChange.css">
</head>
<body>
  <header class="acceptance-header container-fluid">
    <div class="header-inner container d-flex align-items-center justify-content-between py-3">
      <div>
        <a href="Acceptance.html" class="brand">CakeFromZer0</a>
      </div>
      <div class="user-area">
        <span class="user-name">担当者: 管理者 太郎</span>
        <button id="logoutButton" class="btn btn-outline-secondary btn-sm">ログアウト</button>
      </div>
    </div>
  </header>

  <div class="acceptance-layout container">
    <nav class="acceptance-menu">
      <a href="Acceptance.html" class="menu-item">受注管理</a>
      <a href="Replenishment.html" class="menu-item">発注</a>
      <a href="PriceChange.html" class="menu-item active">値段調整</a>
      <a href="Income.html" class="menu-item">損益</a>
      <a href="Administerer.html" class="menu-item">システム管理</a>
    </nav>

    <main class="acceptance-content py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>値段調整</h2>
        <button id="applyPrices" class="btn btn-primary">確定する</button>
      </div>

      <section class="pricechange-list">
        <table class="table">
          <thead>
            <tr>
              <th>材料・オプション名</th>
              <th>現在価格 (¥)</th>
              <th>在庫数</th>
              <th>変更後価格 (¥)</th>
            </tr>
          </thead>
          <tbody id="priceItems">
            <tr data-item-id="100">
              <td class="name">スポンジ(ココア)</td>
              <td class="current-price">200</td>
              <td class="stock">0</td>
              <td><input type="number" min="0" class="new-price form-control form-control-sm" placeholder="例: 220"></td>
            </tr>

            <tr data-item-id="101">
              <td class="name">お誕生日プレート</td>
              <td class="current-price">150</td>
              <td class="stock">2</td>
              <td><input type="number" min="0" class="new-price form-control form-control-sm"></td>
            </tr>

            <tr data-item-id="102">
              <td class="name">クリーム(大)</td>
              <td class="current-price">120</td>
              <td class="stock">5</td>
              <td><input type="number" min="0" class="new-price form-control form-control-sm"></td>
            </tr>
          </tbody>
        </table>
      </section>

      <div class="mt-3 note">
        <p class="text-muted">変更を確定すると表示価格が更新されます。実際の運用ではサーバへ送信してください。</p>
      </div>
    </main>
  </div>

  <script src="../JavaScript/PriceChange.js"></script>
</body>
</html>
