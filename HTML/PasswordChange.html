<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード変更</title>
  <link rel="stylesheet" href="../CSS/bootstrap.css">
  <link rel="stylesheet" href="../CSS/PasswordChange.css">
</head>
<body>
  <header class="d-flex align-items-center sticky-top justify-content-between py-4 container pb-3 border-bottom">
    <h1 class="h4 fw-bold text-primary mb-0">
      <a href="index.html" class="text-decoration-none text-primary">CakeFromZer0</a>
    </h1>
    <button id="menuToggle" class="hamburger-btn" type="button" aria-label="メニューを開く">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </header>

  <div class="menu-panel" id="menuPanel" aria-hidden="true">
    <div class="menu-content">
      <button id="menuClose" class="btn btn-outline-secondary btn-sm mb-3">閉じる</button>
      <a href="Account.html">アカウント</a>
      <a href="#" id="orderHistoryLink">注文履歴</a>
      <a href="#" id="logoutLink">ログアウト</a>
    </div>
  </div>

  <main class="container py-4">
    <div class="password-change-card mx-auto">
      <div class="password-change-header mb-4">
        <h2 class="mb-0">パスワード変更</h2>
      </div>
      <div class="password-change-header mb-4">
        <a href="Account.html" class="back-button"><< 戻る</a>
      </div>

      <p class="password-change-text">メールアドレス宛に届いた番号を入力して、パスワードを変更してください。</p>

      <form id="passwordChangeForm" class="password-change-form">
        <div class="form-group">
          <label for="verificationCode">認証番号</label>
          <input type="text" id="verificationCode" class="form-control" placeholder="123456" required>
        </div>

        <div class="form-group">
          <label for="newPassword">新しいパスワード</label>
          <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">パスワード（確認用）</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary">認証して変更する</button>
      </form>
    </div>
  </main>

  <script src="../JavaScript/PasswordChange.js"></script>
</body>
</html>
